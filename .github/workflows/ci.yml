name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.24"
  RUFF_VERSION: "0.16.10"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Ruff check
        run: uvx "ruff@${RUFF_VERSION}" check --output-format=github .

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          # Matches the runtime of the python:3.11-slim Docker image.
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Install Chromium for browser tests
        run: uv run --locked --extra dev playwright install --with-deps chromium

      - name: Run tests
        env:
          SEARXNCRAWL_REQUIRE_BROWSER_TESTS: "1"
        run: uv run --locked --extra dev pytest -p no:cacheprovider

  ci:
    # Single required status check, enforced by the org ruleset
    # "public-default-branch". Add every job of this workflow to `needs`.
    name: ci
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
