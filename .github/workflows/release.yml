# Publishes searxncrawl to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
# The "pypi" environment only accepts tags matching v* and requires a
# maintainer's approval before the upload job runs.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_VERSION: 0.12.24

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Check that the release tag matches the project version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject version 'v$version'"
            exit 1
          fi

      - name: Check that server.json and the MCPB bundle match the project version
        run: |
          version="$(uv version --short)"
          for v in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)" "$(jq -r .version mcpb/manifest.json)"; do
            if [ "$v" != "$version" ]; then
              echo "::error::server.json or mcpb/manifest.json version '$v' does not match pyproject version '$version'"
              exit 1
            fi
          done
          if ! grep -q "\"searxncrawl==$version\"" mcpb/pyproject.toml; then
            echo "::error::mcpb/pyproject.toml does not pin searxncrawl==$version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/searxncrawl
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
